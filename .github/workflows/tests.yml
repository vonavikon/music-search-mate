name: tests

# Unit tests. No network needed: external calls (LLM gateway, yt-dlp, Telegram,
# Last.fm, Langfuse) are mocked in the tests, no keys required.

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: python -m pytest tests/ --tb=short --ignore=tests/smoke_runner.py -q
